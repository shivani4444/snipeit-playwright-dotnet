name: UI tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build
      - name: Install Playwright browsers
        run: pwsh SnipeItTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run tests
        run: dotnet test --no-build --settings SnipeItTests/test.runsettings --logger "trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults
            SnipeItTests/bin/Debug/net10.0/traces
